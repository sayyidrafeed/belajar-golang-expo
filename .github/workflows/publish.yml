name: Publish images

on:
  # Manual for now. Add `push: branches: [main]` to publish on every push.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Public URL the browser uses to reach the API; baked into the web bundle.
  API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api-todos.sayyidrafee.com' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            file: apps/api/Dockerfile
          - name: web
            context: .
            file: apps/mobile/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EXPO_PUBLIC_API_URL=${{ env.API_URL }}
          tags: |
            ghcr.io/sayyidrafeed/belajar-golang-expo-${{ matrix.name }}:latest
            ghcr.io/sayyidrafeed/belajar-golang-expo-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
